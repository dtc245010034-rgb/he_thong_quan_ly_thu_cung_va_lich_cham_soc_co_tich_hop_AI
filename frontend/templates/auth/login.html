{% extends "base.html" %}

{% block title %}Đăng nhập — Quản lý Thú cưng{% endblock %}

{% block content %}
<div class="container" style="max-width: 420px; margin-top: 8vh;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Đăng nhập</h1>
      <p class="text-secondary small mb-4">Hệ thống Quản lý Thú cưng &amp; Lịch chăm sóc</p>

      {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('auth.trang_dang_nhap') }}">
        <div class="mb-3">
          <label class="form-label" for="username">Tên đăng nhập</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Mật khẩu</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
